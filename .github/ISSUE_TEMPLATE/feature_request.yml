name: 功能建议
description: 描述实际业务问题与希望获得的改进
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 业务场景与问题
      description: 使用匿名示例说明当前工作在哪一步遇到困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前做法与其他方案
