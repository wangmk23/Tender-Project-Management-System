<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>项目管理系统 - 设备授权</title>
  <link rel="icon" href="/static/app-icon.ico">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#182230;font-family:"Microsoft YaHei",sans-serif}.panel{width:min(520px,calc(100vw - 32px));padding:34px;background:#fff;border:1px solid #dfe5ec;border-radius:8px;box-shadow:0 18px 50px rgba(20,35,55,.12)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.brand img{width:42px;height:42px}.brand h1{margin:0;font-size:22px}.brand p{margin:4px 0 0;color:#718096;font-size:13px}.status{padding:14px;margin-bottom:20px;background:#fff6e6;border-left:4px solid #f59e0b;border-radius:4px}.status b{display:block;margin-bottom:4px}.status span{font-size:13px;color:#805b18}.label{font-size:12px;font-weight:700;color:#667085;margin-bottom:7px}.device{display:flex;align-items:center;gap:8px;padding:12px;background:#f5f7fa;border:1px solid #dfe5ec;border-radius:5px}.device code{flex:1;font-size:17px;font-weight:700;letter-spacing:0}.device button,.actions button{border:1px solid #cfd7e3;background:#fff;border-radius:5px;padding:9px 13px;cursor:pointer}.steps{margin:22px 0;padding-left:20px;color:#475467;font-size:13px;line-height:1.9}.actions{display:flex;gap:10px}.actions button{flex:1;background:#2563eb;color:#fff;border-color:#2563eb;font-weight:700}.actions button.secondary{background:#fff;color:#344054;border-color:#cfd7e3}.foot{margin-top:18px;color:#98a2b3;font-size:11px;text-align:center}
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand"><img src="/static/app-logo.svg" alt=""><div><h1>项目管理系统</h1><p>设备授权</p></div></div>
    <div class="status"><b>{{ license_info.message }}</b><span>状态：{{ license_info.status }}</span></div>
    <div class="label">当前电脑设备码</div>
    <div class="device"><code id="deviceCode">{{ license_info.device_code }}</code><button onclick="copyCode()">复制</button></div>
    <ol class="steps">
      <li>打开随发布包提供的授权工具。</li>
      <li>首次使用先初始化签发密钥，选择本系统所在文件夹。</li>
      <li>填写使用单位并选择期限，生成本机授权。绑定版须在配置的磁盘上运行。</li>
      <li>授权完成后返回此页面刷新。</li>
    </ol>
    <div class="actions"><button onclick="location.reload()">刷新授权状态</button><button class="secondary" onclick="location.href='/login'">进入系统</button></div>
    <div class="foot">授权异常不会删除项目数据库或附件。</div>
  </main>
  <script>
    async function copyCode(){const text=document.getElementById('deviceCode').textContent;try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}}
  </script>
</body>
</html>
